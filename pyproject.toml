[project]
name = "crohnicity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13.9",
    "fastapi>=0.137.1",
    "fire>=0.7.1",
    "google-genai>=2.8.0",
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "ipython>=9.14.1",
    "jupyter>=1.1.1",
    "jupytext>=1.19.3",
    "litellm>=1.89.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0.4",
    "networkx>=3.6.1",
    "odfpy>=1.4.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "plotnine>=0.15.7",
    "pydantic>=2.13.4",
    "pytest>=9.1.0",
    "python-dotenv>=1.2.2",
    "pyvis>=0.3.2",
    "ruff>=0.15.17",
    "tabulate>=0.10.0",
    "ty>=0.0.49",
    "wordcloud>=1.9.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
# Only collect tests/ — keeps the jupytext notebook mirrors in notebooks/ (e.g.
# 03_extraction_test.py, which matches *_test.py) out of test discovery.
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocstrings[python]>=1.0.4",
]
