site_name: Crohnicity
docs_dir: docs

# Default MkDocs theme (simplest); the one added plugin is mermaid2, to render the referral-pathway
# gallery's Mermaid diagrams in the docsite. Swap in mkdocs-material later if wanted.
nav:
  - Home: index.md
  - Schema: SCHEMA.md
  - System design: SYSTEM_DESIGN.md
  - Referral pathways: referral_pathways.md
  - Dev Setup: DEV_SETUP.md
  - Implementation TODO: TODO.md
  - Notes:
      - Questions (CAIO): QUESTIONS.md
      - Task instructions: TASK_INSTRUCTIONS.md
      - Hypotheses: HYPOTHESES.md
      - Resources: RESOURCES.md
      - Telemetry: TELEMETRY.md
      - Error handling: DEBUGGING_ERROR_HANDLING.md
      - Gold review: TO_REVIEW.md
  - API reference:
      - Source (src/): api/src.md
      - Tests (tests/): api/tests.md

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          paths: [src, tests]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            heading_level: 2
